plugins {
    id 'com.android.application'
}

// versionCode and versionName come from the release workflow (-PversionCode=12 -PversionName=1.12)
def vCode = (project.findProperty('versionCode') ?: '1') as int
def vName = (project.findProperty('versionName') ?: '1.0') as String

android {
    namespace 'io.github.e1caro.fitquest'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.e1caro.fitquest'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    // Every release is signed with the same key (the FITQUEST_KEYSTORE secret, written to ../fitquest.jks by the
    // workflow), so a new APK installs over the old one and keeps your data.
    signingConfigs {
        release {
            storeFile file('../fitquest.jks')
            storePassword System.getenv('FITQUEST_KEY_PASS') ?: 'fitquest'
            keyAlias 'fitquest'
            keyPassword System.getenv('FITQUEST_KEY_PASS') ?: 'fitquest'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
