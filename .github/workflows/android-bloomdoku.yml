name: android-bloomdoku

# Builds the Bloomdoku Android app (android-bloomdoku/, with bloomdoku/ packed inside it).
# - On pull requests that touch the app: builds the APK as a check (downloadable from the run's artifacts).
# - Run by hand (Actions > android-bloomdoku > Run workflow, or asked from Claude): builds and publishes a release
#   "Bloomdoku 1.N" (tag bloomdoku-N) with the APK, which can be downloaded and installed straight from a phone.
# Each release also carries web.zip (the web app) and shell-S (the native version it needs): installed apps download
# web.zip by themselves and show it from the next time they open, so the APK is only reinstalled when the shell changes.
# Tags are bloomdoku-N, never v* (that would start the PyPI publish workflow) and never app-N (FitQuest's updater
# looks for those); releases are not marked "latest".
#
# Signing: every release must use the same key, so each APK installs over the previous one and keeps the data.
# It reuses the repository's existing sideload key (secrets FITQUEST_KEYSTORE and FITQUEST_KEY_PASS, the same
# ones android.yml uses). Without them a one-off key is generated: the APK installs, but a later one will not
# update it (uninstall first; sign in before, so your progress is kept in your account).

on:
  push:
    branches: [master]
    paths: ["android-bloomdoku/**", "bloomdoku/**", ".github/workflows/android-bloomdoku.yml"]
  pull_request:
    branches: [master]
    paths: ["android-bloomdoku/**", "bloomdoku/**", ".github/workflows/android-bloomdoku.yml"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this version"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-bloomdoku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test the web app (every level's gardens, accounts and friends against a fake service)
        run: |
          node bloomdoku/tests/unit.js
          node bloomdoku/tests/unit-cloud.js

      - name: Pack the web app into the APK
        run: |
          mkdir -p android-bloomdoku/app/src/main/assets/www
          rsync -a --delete --exclude tests --exclude tools --exclude README.md --exclude sw.js \
            bloomdoku/ android-bloomdoku/app/src/main/assets/www/

      - name: Pack the web app for installed apps to update themselves
        run: |
          (cd android-bloomdoku/app/src/main/assets/www && zip -qr "$GITHUB_WORKSPACE/web.zip" .)
          SHELL_V=$(grep -oE "bloomShell'\) \?: '[0-9]+'" android-bloomdoku/app/build.gradle | grep -oE "[0-9]+" | tail -1)
          echo "$SHELL_V" > "shell-$SHELL_V" # not empty: GitHub refuses empty release files
          ls -la web.zip shell-*

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FITQUEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android-bloomdoku/bloomdoku.jks
          else
            echo "::warning::No FITQUEST_KEYSTORE secret: signing with a one-off key, so a later APK will not be able to update this one."
            keytool -genkeypair -keystore android-bloomdoku/bloomdoku.jks -alias fitquest -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fitquest -keypass fitquest -dname "CN=Bloomdoku"
          fi

      - name: Build
        env:
          BLOOM_KEY_PASS: ${{ secrets.FITQUEST_KEY_PASS || 'fitquest' }}
        run: |
          gradle -p android-bloomdoku assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon --console=plain

      - name: Name the APK and check it
        run: |
          APK=Bloomdoku-1.${{ github.run_number }}.apk
          cp android-bloomdoku/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -la "$APK"
          # the web app must really be inside
          unzip -l "$APK" | grep -E "assets/www/(index.html|js/engine.js|js/app.js)"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Show package and signature
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label:|^uses-permission"

      - uses: actions/upload-artifact@v4
        with:
          name: Bloomdoku-1.${{ github.run_number }}
          path: Bloomdoku-1.${{ github.run_number }}.apk

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bloomdoku-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Bloomdoku 1.${{ github.run_number }}
          body: |
            ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.notes) || 'Bloomdoku for Android: a sudoku garden with 4,400 gardens in 11 worlds, two-figure twin gardens, hints that explain, chestnuts and a shop, friends and messages, and a daily bouquet. The game works offline.' }}

            **Install on Android:** download `Bloomdoku-1.${{ github.run_number }}.apk` on your phone, open it and allow "Install unknown apps" for your browser when asked.
            **Instalar en Android:** descarga `Bloomdoku-1.${{ github.run_number }}.apk` en el móvil, ábrelo y permite "Instalar apps desconocidas" para tu navegador cuando te lo pida.

            Your progress is stored on the phone. To have it on another device too, sign in with the same account (Friends tab or Settings) on both.
          files: |
            Bloomdoku-1.${{ github.run_number }}.apk
            web.zip
            shell-*
          make_latest: false
