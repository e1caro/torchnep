name: desktop-blackjack

# Builds the desktop program (desktop-blackjack/: the Blackjack table and the Hi-Lo trainer in one Windows .exe) and
# runs the real .exe on Windows. Nothing is released: the .exe and screenshots of the run are attached to the workflow
# run as artifacts.

on:
  push:
    branches: [master, "claude/**", "ccr-**"]
    paths: ["desktop-blackjack/**", "blackjack/**", "hilo/**", ".github/workflows/desktop-blackjack.yml"]
  pull_request:
    branches: [master]
    paths: ["desktop-blackjack/**", "blackjack/**", "hilo/**", ".github/workflows/desktop-blackjack.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-blackjack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-blackjack/go.mod
          cache-dependency-path: desktop-blackjack/go.sum

      - name: Test the rules (blackjack table, trainer chart)
        run: |
          node blackjack/tests/unit.js
          cd hilo/tests && python3 strategy_check.py && node exact6.js

      - name: Build BlackjackHiLo.exe
        run: python3 desktop-blackjack/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: BlackjackHiLo-windows
          path: desktop-blackjack/dist/BlackjackHiLo.exe
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BlackjackHiLo-windows
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the test driver
        working-directory: desktop-blackjack
        run: npm install --no-save --no-audit --no-fund playwright-core

      - name: Run the program and play through it
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          "sha256 " + (Get-FileHash dist\BlackjackHiLo.exe -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath dist\BlackjackHiLo.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "the program exited at once with code $($p.ExitCode)" }
          "window title: " + (Get-Process -Id $p.Id).MainWindowTitle
          node desktop-blackjack/tests/smoke.js --cdp http://127.0.0.1:9222 --shots shots
          if ($LASTEXITCODE -ne 0) { throw "the play-through failed" }
          # close the window as a person would, open it again: the seat and the rules must still be there
          $p.CloseMainWindow() | Out-Null
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 3
          $p = Start-Process -FilePath dist\BlackjackHiLo.exe -PassThru
          Start-Sleep -Seconds 10
          node desktop-blackjack/tests/smoke.js --cdp http://127.0.0.1:9222 --shots shots --after-restart
          if ($LASTEXITCODE -ne 0) { throw "the saved games did not survive a restart" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
