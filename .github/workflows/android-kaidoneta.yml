name: android-kaidoneta

# Builds the Kaidoneta Android app (android-kaidoneta/, with kaidoneta/ packed inside it).
# - On a push to a claude/** branch or a pull request that touches the app: builds the APK as a check
#   (downloadable from the run's artifacts).
# - On a push to master that touches the app, or run by hand (Actions > android-kaidoneta > Run workflow):
#   builds and publishes a release "Kaidoneta 1.N" (tag kaidoneta-N) with the APK, which can be downloaded and
#   installed straight from a phone.
# Each release also carries web.zip (the web app) and shell-S (the native version it needs): installed apps download
# web.zip by themselves and show it from the next time they open, so the APK is only reinstalled when the shell changes.
# Tags are kaidoneta-N, never v* (that would start the PyPI publish workflow), app-N (FitQuest's updater) or
# bloomdoku-N (Bloomdoku's); releases are not marked "latest".
#
# Signing: every release must use the same key, so each APK installs over the previous one and keeps the data.
# It reuses the repository's sideload key (secrets FITQUEST_KEYSTORE and FITQUEST_KEY_PASS, as android.yml and
# android-bloomdoku.yml do). Without them a one-off key is generated: the APK installs, but a later one will not
# update it (uninstall first; with the crew online, everything comes back when you join again).

on:
  push:
    branches: [master, "claude/**"]
    paths: ["android-kaidoneta/**", "kaidoneta/**", ".github/workflows/android-kaidoneta.yml"]
  pull_request:
    branches: [master]
    paths: ["android-kaidoneta/**", "kaidoneta/**", ".github/workflows/android-kaidoneta.yml"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this version"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-kaidoneta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test the web app (data, rankings, badges and the online crew against a fake service)
        run: node kaidoneta/tests/unit.js

      - name: Pack the web app into the APK
        run: |
          mkdir -p android-kaidoneta/app/src/main/assets/www
          rsync -a --delete --exclude tests --exclude tools --exclude README.md --exclude sw.js \
            kaidoneta/ android-kaidoneta/app/src/main/assets/www/

      - name: Pack the web app for installed apps to update themselves
        run: |
          (cd android-kaidoneta/app/src/main/assets/www && zip -qr "$GITHUB_WORKSPACE/web.zip" .)
          SHELL_V=$(grep -oE "kaidoShell'\) \?: '[0-9]+'" android-kaidoneta/app/build.gradle | grep -oE "[0-9]+" | tail -1)
          echo "$SHELL_V" > "shell-$SHELL_V" # not empty: GitHub refuses empty release files
          ls -la web.zip shell-*

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FITQUEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android-kaidoneta/kaidoneta.jks
          else
            echo "::warning::No FITQUEST_KEYSTORE secret: signing with a one-off key, so a later APK will not be able to update this one."
            keytool -genkeypair -keystore android-kaidoneta/kaidoneta.jks -alias fitquest -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fitquest -keypass fitquest -dname "CN=Kaidoneta"
          fi

      - name: Build
        env:
          KAIDO_KEY_PASS: ${{ secrets.FITQUEST_KEY_PASS || 'fitquest' }}
        run: |
          gradle -p android-kaidoneta assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon --console=plain

      - name: Name the APK and check it
        run: |
          APK=Kaidoneta-1.${{ github.run_number }}.apk
          cp android-kaidoneta/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -la "$APK"
          # the web app must really be inside
          unzip -l "$APK" | grep -E "assets/www/(index.html|js/app.js|js/core.js)"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Show package and signature
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label:|^uses-permission"

      - uses: actions/upload-artifact@v4
        with:
          name: Kaidoneta-1.${{ github.run_number }}
          path: Kaidoneta-1.${{ github.run_number }}.apk

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kaidoneta-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Kaidoneta 1.${{ github.run_number }}
          body: |
            ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.notes) || 'Kaidoneta para Android: el tracker de la tripulación para el Regional de Bristol de One Piece Card Game. Registra rondas, recompensas, el Tablón de recompensas, el meta, insignias y temporizador. Funciona sin conexión.' }}

            **Instalar en Android:** descarga `Kaidoneta-1.${{ github.run_number }}.apk` en el móvil, ábrelo y permite "Instalar apps desconocidas" para tu navegador cuando te lo pida.

            La app se actualiza sola: cuando hay una versión nueva, la descarga y la muestra la próxima vez que la abres.
          files: |
            Kaidoneta-1.${{ github.run_number }}.apk
            web.zip
            shell-*
          make_latest: false
