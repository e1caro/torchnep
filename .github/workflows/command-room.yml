name: command-room

on:
  push:
    paths:
      - "command-room/**"
      - ".github/workflows/command-room.yml"
  pull_request:
    paths:
      - "command-room/**"
      - ".github/workflows/command-room.yml"
  workflow_dispatch:

concurrency:
  group: command-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (standard library only; nothing here contacts a cluster)
        working-directory: command-room
        run: python -m unittest discover -s tests -v
