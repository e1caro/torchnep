name: android-myday

# Builds the My Day Android app (android-myday/: a home-screen widget with the day's schedule from the phone's
# calendar, to-dos and notes).
# - On a push to a claude/** or ccr-** branch or a pull request that touches the app: builds the APK, runs the
#   checks and opens the app on an emulator (APK, screenshots and log downloadable from the run's artifacts).
# - On a push to master that touches the app, or run by hand (Actions > android-myday > Run workflow): also
#   publishes a release "My Day 1.N" (tag myday-N) with the APK.
# Installed apps read these releases and update themselves, so a release only goes out once the emulator check
# has passed. Tags are myday-N, never v* (that would start the PyPI publish workflow), app-N (FitQuest's updater)
# or another app's; releases are not marked "latest".
#
# No Gradle: the app has no libraries, and android-myday/build.sh drives the SDK's tools directly.
#
# Signing: every release must use the same key, so each APK installs over the previous one and keeps the data.
# It reuses the repository's sideload key (secrets FITQUEST_KEYSTORE and FITQUEST_KEY_PASS, as the other apps
# do). Without them a one-off key is generated: the APK installs, but a later one will not update it.

on:
  push:
    branches: [master, "claude/**", "ccr-**"]
    paths: ["android-myday/**", ".github/workflows/android-myday.yml"]
  pull_request:
    branches: [master]
    paths: ["android-myday/**", ".github/workflows/android-myday.yml"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this version"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-myday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.FITQUEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android-myday/myday.jks
          else
            echo "::warning::No FITQUEST_KEYSTORE secret: signing with a one-off key, so a later APK will not be able to update this one."
            keytool -genkeypair -keystore android-myday/myday.jks -alias fitquest -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fitquest -keypass fitquest -dname "CN=My Day"
          fi

      - name: Android SDK tools
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-34"
          if [ ! -f "$PLATFORM/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          fi
          echo "ANDROID_JAR=$PLATFORM/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE: ${{ github.workspace }}/android-myday/myday.jks
          KEY_ALIAS: fitquest
          KEY_PASS: ${{ secrets.FITQUEST_KEY_PASS || 'fitquest' }}
          VERSION_CODE: ${{ github.run_number }}
        run: android-myday/build.sh

      - name: Checks (dates, widget styles, the Claude request, finding a newer release)
        run: android-myday/tools/check.sh

      - name: Name the APK
        run: |
          APK=MyDay-1.${{ github.run_number }}.apk
          cp android-myday/build/MyDay.apk "$APK"
          ls -la "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Show package and signature
        continue-on-error: true
        run: |
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -5
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label:|^uses-permission"

      - uses: actions/upload-artifact@v4
        with:
          name: MyDay-1.${{ github.run_number }}
          path: MyDay-1.${{ github.run_number }}.apk

  # The app on an Android emulator: it must open without crashing and draw every widget style.
  device:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MyDay-1.${{ github.run_number }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-myday/tools/device-check.sh MyDay-1.${{ github.run_number }}.apk android-myday/device-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyDay-device-${{ github.run_number }}
          path: android-myday/device-out

  release:
    needs: [apk, device]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyDay-1.${{ github.run_number }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: myday-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: My Day 1.${{ github.run_number }}
          body: |
            ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.notes) || 'My Day for Android: a home-screen widget with the schedule for the day from your calendar, to-dos and notes, in six styles.' }}

            **Install on Android:** download `MyDay-1.${{ github.run_number }}.apk` on your phone, open it and allow "Install unknown apps" for your browser when asked.

            Once installed, the app looks for newer versions by itself and installs them.
          files: MyDay-1.${{ github.run_number }}.apk
          make_latest: false
