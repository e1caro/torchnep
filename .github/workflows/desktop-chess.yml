name: desktop-chess

# Builds the Windows program (desktop-chess/: the Eighth Rank chess course in one .exe) and its installer, and runs them on Windows:
# the .exe plays through itself (tests/selftest.js), is closed, has its window storage deleted and is opened again to
# check that your progress comes back from saved.json; then the installer is run silently, the installed program is
# opened (it must find that progress), and it is uninstalled again (the progress must stay).
# - On a push to a claude/** or ccr-** branch or a pull request: the .exe, the installer and a picture of the window
#   are attached to the run as artifacts.
# - On a push to master that touches it, or run by hand (Actions > desktop-chess > Run workflow): also published as a
#   release "Eighth Rank for Windows 1.N" (tag chess-pc-N, never v*, which belongs to another workflow).

on:
  push:
    branches: [master, "claude/**", "ccr-**"]
    paths: ["desktop-chess/**", "chess/**", ".github/workflows/desktop-chess.yml"]
  pull_request:
    branches: [master]
    paths: ["desktop-chess/**", "chess/**", ".github/workflows/desktop-chess.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-chess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-chess/go.mod
          cache-dependency-path: desktop-chess/go.sum

      - name: Test the engine (move counts), every lesson position and every opening line
        run: node chess/tools/test.js

      - name: NSIS, for the installer
        run: sudo apt-get install -y -q nsis

      - name: Build EighthRank.exe and EighthRank-Setup.exe
        env:
          CHESS_VERSION: 1.${{ github.run_number }}
        run: |
          python3 desktop-chess/build.py
          test -f desktop-chess/dist/EighthRank-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EighthRank-windows
          path: |
            desktop-chess/dist/EighthRank.exe
            desktop-chess/dist/EighthRank-Setup.exe
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: EighthRank-windows
          path: dist

      - name: Run the program and let it play through itself
        shell: pwsh
        run: |
          "sha256 " + (Get-FileHash dist\EighthRank.exe -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force shots | Out-Null
          function Play($mode, $exe = 'dist\EighthRank.exe') {
            $log = Join-Path $PWD "selftest-$mode.log"
            $env:CHESS_SELFTEST = $log
            $env:CHESS_SELFTEST_MODE = $mode
            $p = Start-Process -FilePath $exe -PassThru
            $null = $p.Handle
            Start-Sleep -Seconds 6
            if (-not $p.HasExited) { "window title: " + (Get-Process -Id $p.Id).MainWindowTitle }
            if (-not $p.WaitForExit(420000)) { Stop-Process -Id $p.Id -Force; if (Test-Path $log) { Get-Content $log }; throw "the $mode play-through did not finish" }
            if (Test-Path $log) { Get-Content $log } else { throw "the program wrote no log (exit code $($p.ExitCode))" }
            if ($p.ExitCode -ne 0) { throw "the $mode play-through failed (exit code $($p.ExitCode))" }
          }
          Play "full"
          # Closed: the window's own storage is deleted. Opened again, the lessons, puzzles and opening lines must come
          # back from saved.json, the program's own copy.
          $edge = { @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -match 'EighthRank' }).Count }
          for ($i = 0; $i -lt 30 -and (& $edge) -gt 0; $i++) { Start-Sleep -Seconds 1 }
          $data = Join-Path $env:APPDATA 'EighthRank'
          "saved.json: " + $(if (Test-Path "$data\saved.json") { (Get-Item "$data\saved.json").Length.ToString() + " bytes" } else { "missing" })
          Remove-Item -Recurse -Force "$data\EBWebView\Default\Local Storage" -ErrorAction Stop
          "the window's storage was deleted"
          Play "restart"

          # The installer, as a person runs it but without its window: no administrator, nothing asked.
          $p = Start-Process -FilePath dist\EighthRank-Setup.exe -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer failed (exit code $($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\EighthRank'
          $exe = Join-Path $dir 'EighthRank.exe'
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'Eighth Rank.lnk'
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Eighth Rank.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EighthRank'
          foreach ($f in @($exe, (Join-Path $dir 'Uninstall.exe'), $start, $desk)) {
            if (-not (Test-Path $f)) { throw "missing after the install: $f" }
            "installed: $f"
          }
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash dist\EighthRank.exe).Hash) { throw "the installed program is not the one that was built" }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut($start)
          if ($lnk.TargetPath -ne $exe) { throw "the Start menu shortcut points at $($lnk.TargetPath)" }
          $k = Get-ItemProperty $key
          if ($k.DisplayName -ne 'Eighth Rank') { throw "not listed in Settings > Apps" }
          "Settings > Apps: $($k.DisplayName) $($k.DisplayVersion) by $($k.Publisher), $($k.EstimatedSize) KB, uninstalled by $($k.UninstallString)"
          for ($i = 0; $i -lt 30 -and (& $edge) -gt 0; $i++) { Start-Sleep -Seconds 1 }
          Play "restart" $exe     # the installed program opens and finds the progress of the runs above

          # Uninstalled again (the uninstaller finishes from a copy of itself in TEMP: wait for it)
          for ($i = 0; $i -lt 30 -and (& $edge) -gt 0; $i++) { Start-Sleep -Seconds 1 }
          Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          foreach ($f in @($exe, $start, $desk, $key)) { if (Test-Path $f) { throw "still there after uninstalling: $f" } }
          if (-not (Test-Path (Join-Path $env:APPDATA 'EighthRank\saved.json'))) { throw "uninstalling removed your progress" }
          "uninstalled: the program, its shortcuts and its entry are gone; your progress is still in %APPDATA%\EighthRank"

      - name: A picture of the window as a person gets it
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item Env:CHESS_SELFTEST -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\EighthRank.exe -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save((Join-Path $PWD "shots\window.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chess-screenshots
          path: shots
          if-no-files-found: ignore

  release:
    needs: windows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EighthRank-windows
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chess-pc-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Eighth Rank for Windows 1.${{ github.run_number }}
          body: |
            Eighth Rank for Windows 10 and 11: a chess course of 56 lessons in six ranks with a test closing each rank, 1,000 puzzles, 16 openings with 61 lines to explore and train, a computer opponent with a coach that rates every move, endgame positions to practise against it, and two board-vision drills. Works offline.

            **Install:** download `EighthRank-Setup.exe` and open it. It installs for you only (no administrator), puts Eighth Rank in the Start menu and on the desktop, and lists it in Settings > Apps for uninstalling. Installing a newer version over an older one keeps your progress, and so does uninstalling.

            **Or without installing:** `EighthRank.exe` is the same program as one portable file; run it from anywhere.

            Neither file is signed, so the first time Windows SmartScreen says "Windows protected your PC": choose **More info**, then **Run anyway**. Your progress is kept in `%APPDATA%\EighthRank`.
          files: |
            dist/EighthRank-Setup.exe
            dist/EighthRank.exe
          make_latest: false
