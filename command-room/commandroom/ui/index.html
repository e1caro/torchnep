<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icon.ico" sizes="any">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="name"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="8.2"/><path class="ring" d="M10 1.8v3M10 15.2v3M1.8 10h3M15.2 10h3"/><circle class="core" cx="10" cy="10" r="2.6"/></svg>Command Room</div>
  <nav class="tabs" id="tabs" aria-label="Areas"></nav>
  <div class="chips" id="chips"></div>
  <input class="cmd" id="cmd" type="text" aria-label="Command bar" placeholder="Go to, find, or ask   Ctrl+K" autocomplete="off">
  <button class="plain" id="askbtn" type="button">Ask</button>
  <span class="live" id="live" role="status"><i></i><span>connecting</span></span>
  <button class="plain" id="theme" type="button"></button>
</header>
<main id="main"></main>
<aside class="drawer" id="drawer" aria-label="Assistant" hidden>
  <div class="drawerhead"><h2>Assistant</h2><button class="icon" id="askclose" type="button" aria-label="Close the assistant"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
  <p class="fine">It reads the pipeline, the clusters' state and the Library, and says where each answer comes from. It cannot run or send anything. Every question uses your Claude quota.</p>
  <div class="talk" id="talk"></div>
  <form id="askform"><textarea name="q" rows="3" placeholder="Why is ShengBTE of C rfe marked check first?" required></textarea><button class="solid">Ask</button></form>
</aside>
<div class="toast" id="toast" role="status" hidden></div>
<script src="results.js"></script>
<script src="app.js"></script>
</body>
</html>
