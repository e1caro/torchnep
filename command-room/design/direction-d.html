<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Room, direction D: overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1424; --panel: #121c31; --panel-2: #1a2742; --line: #263657; --dot: rgba(120, 150, 210, .16);
  --ink: #eaf0fb; --ink-2: #a9b8d6; --muted: #7083a9; --track: #2c3e66;
  --done: #2fd3a7; --sent: #a99bff; --failed: #ff5d6c; --attention: #ffbf3c; --on: #0c1424; --glow: .32;
  --sans: "Barlow", "Segoe UI", sans-serif; --cond: "Barlow Semi Condensed", "Barlow", "Segoe UI", sans-serif;
  --mono: "DM Mono", "Cascadia Mono", Consolas, monospace;
}
[data-theme="light"] {
  --bg: #e9edf5; --panel: #ffffff; --panel-2: #f1f4fa; --line: #d2d9e8; --dot: rgba(20, 33, 61, .10);
  --ink: #14213d; --ink-2: #44506b; --muted: #6b7690; --track: #c5cee0;
  --done: #0f9a7a; --sent: #6a55d8; --failed: #cf2f3f; --attention: #c07a00; --on: #ffffff; --glow: 0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.app { display: grid; grid-template-columns: 172px minmax(0, 1fr) 344px; grid-template-rows: 54px auto; min-height: 100vh; }
.rail { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; }
.rail .name { font: 700 20px/1.05 var(--cond); padding: 0 8px 18px; }
.rail a { display: block; padding: 7px 8px; border-radius: 4px; color: var(--ink-2); text-decoration: none; font: 500 15px var(--cond); }
.rail a[aria-current] { background: var(--panel-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--done); }
.rail a:hover { color: var(--ink); }
.top { grid-column: 2 / 4; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.cmd { flex: 1; max-width: 540px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; font-family: var(--mono); font-size: 13px; }
.cmd::placeholder { color: var(--muted); }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font: 400 12.5px var(--mono); }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--done); box-shadow: 0 0 calc(10px * var(--glow)) var(--done); }
.live.beat i { animation: beat .7s ease-out 1; }
.live.lost i { background: var(--attention); border-radius: 2px; box-shadow: none; }
.plain { background: none; border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font-size: 13px; }
.plain:hover { border-color: var(--ink-2); }
main { padding: 18px 20px 28px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
.mimic { background: radial-gradient(var(--dot) 1px, transparent 1.4px) 0 0 / 22px 22px, var(--panel); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; margin-bottom: 12px; }
h2 { margin: 0; font: 600 18px/1.2 var(--cond); }
.status { margin: 0; font: 600 clamp(17px, 1.7vw, 22px)/1.2 var(--cond); }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key .lamp { width: 16px; height: 16px; pointer-events: none; animation: none; border-width: 2px; box-shadow: none; filter: none; }
.key .lamp svg, .key .lamp.attention svg { width: 10px; height: 10px; }
.key .lamp.attention svg { width: 16px; height: 16px; }
.wallbox { overflow-x: auto; padding: 4px 0 6px; scrollbar-color: var(--line) transparent; }
.wallwrap { position: relative; min-width: min-content; }
#tracks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.seg { fill: none; stroke-linecap: round; stroke-width: 4; stroke: var(--track); }
.seg.lit { stroke: var(--done); opacity: .8; filter: drop-shadow(0 0 calc(5px * var(--glow)) var(--done)); }
.seg.dim { stroke-dasharray: 1 9; }
.seg.next { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 5 11; animation: flow .9s linear infinite; }
.origin { fill: var(--panel); stroke: var(--ink-2); stroke-width: 1.8; }
.otext { fill: var(--muted); font: 400 11.5px var(--mono); }
.wall { display: grid; row-gap: 2px; position: relative; }
.corner { align-self: end; color: var(--muted); font: 500 13px var(--cond); padding: 0 0 8px 4px; }
.stagehead { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 8px; min-width: 128px; }
.stagehead b { font: 600 15px var(--cond); text-align: center; overflow-wrap: anywhere; }
.tools { display: inline-flex; gap: 1px; opacity: 0; }
.stagehead:hover .tools, .lanehead:hover .tools, .tools:focus-within { opacity: 1; }
.icon { background: none; border: 0; border-radius: 4px; width: 20px; height: 20px; padding: 0; color: var(--ink-2); display: inline-grid; place-items: center; }
.icon:hover { background: var(--panel-2); color: var(--ink); }
.icon svg { width: 11px; height: 11px; }
.lanehead { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 6px 0 4px; font: 600 16px var(--cond); white-space: nowrap; }
.lanehead.variant { padding-left: 24px; font-weight: 500; font-size: 15px; color: var(--ink-2); }
.lanehead small { font: 400 11.5px var(--mono); color: var(--muted); }
.lanehead .tools { margin-left: auto; }
.cell { display: grid; place-items: center; height: 46px; }
.lamp { width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; position: relative; background: var(--panel); color: var(--on); }
.lamp svg { width: 16px; height: 16px; }
.lamp.done { background: var(--done); box-shadow: 0 0 calc(14px * var(--glow)) var(--done); }
.lamp.failed { background: var(--failed); box-shadow: 0 0 calc(14px * var(--glow)) var(--failed); }
.lamp.sent { background: var(--panel); border: 3px solid var(--sent); color: var(--sent); animation: pulse 1.8s ease-in-out infinite; }
.lamp.todo { border: 3px solid var(--ink); }
.lamp.waiting { border: 2px dashed var(--muted); }
.lamp.attention { background: none; color: var(--attention); border-radius: 6px; filter: drop-shadow(0 0 calc(7px * var(--glow)) var(--attention)); }
.lamp.attention svg { width: 30px; height: 30px; }
.lamp[aria-pressed="true"]::after { content: ""; position: absolute; inset: -7px; border: 2px solid var(--ink); border-radius: 50%; }
.lamp.changed::before { content: ""; position: absolute; inset: 0; border-radius: 50%; animation: ring 1.4s ease-out 1; }
.add { width: 30px; height: 30px; border-radius: 50%; border: 1px dashed transparent; background: none; color: transparent; font-size: 17px; line-height: 1; padding: 0; }
.cell:hover .add, .add:focus-visible { border-color: var(--muted); color: var(--ink-2); background: var(--panel); }
@keyframes flow { to { stroke-dashoffset: -16; } }
@keyframes pulse { 50% { box-shadow: 0 0 calc(16px * var(--glow)) 2px var(--sent); } }
@keyframes ring { from { box-shadow: 0 0 0 0 var(--ink); } to { box-shadow: 0 0 0 16px transparent; } }
@keyframes beat { from { box-shadow: 0 0 0 0 var(--done); } to { box-shadow: 0 0 0 9px transparent; } }
@media (prefers-reduced-motion: reduce) { .seg.next, .lamp.sent, .lamp.changed::before, .live.beat i { animation: none; } }
.notice { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 12px; min-height: 20px; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--ink); font-size: 13px; }
details.edit { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
details.edit summary { cursor: pointer; font: 500 14px var(--cond); color: var(--ink-2); width: max-content; }
.forms { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 12px; }
.forms form { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
.forms label { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.forms input, .forms select { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; min-width: 130px; }
.solid { background: var(--ink); color: var(--bg); border: 0; border-radius: 5px; padding: 7px 13px; font: 600 14px var(--cond); }
.src { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.src .panel { padding: 13px 15px; }
.src h3 { margin: 0 0 4px; font: 600 15px var(--cond); display: flex; align-items: center; gap: 8px; }
.src h3 i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px dashed var(--muted); }
.src h3 i.on { border: 0; background: var(--sent); box-shadow: 0 0 calc(10px * var(--glow)) var(--sent); }
.src p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.prog { height: 6px; border-radius: 3px; background: var(--panel-2); margin: 6px 0 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--sent); }
.dock { background: var(--panel); border-left: 1px solid var(--line); padding: 18px 16px; }
.dock section + section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.dock h2 { margin-bottom: 8px; }
dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 13.5px; }
dt { color: var(--muted); } dd { margin: 0; }
pre { margin: 12px 0 0; padding: 9px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; font: 400 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.acts .plain[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fine { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.next { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.next button { width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; }
.next button:hover { border-color: var(--ink-2); }
.next b { display: flex; justify-content: space-between; gap: 8px; font: 600 15px var(--cond); }
.next b span { font: 400 12.5px var(--sans); color: var(--ink-2); white-space: nowrap; }
.next p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
@media (max-width: 1180px) { .app { grid-template-columns: 172px minmax(0, 1fr); } .top { grid-column: 2; } .dock { grid-column: 2; border-left: 0; border-top: 1px solid var(--line); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .rail { grid-row: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .name { padding: 6px 8px; white-space: nowrap; } .rail a { white-space: nowrap; }
  .top, .dock { grid-column: 1; } .top { flex-wrap: wrap; height: auto; padding: 10px 14px; } .live { margin-left: 0; }
  main { padding: 14px; } .src { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Areas">
    <div class="name">Command Room</div>
    <a href="#" aria-current="page">Overview</a><a href="#">Board</a><a href="#">Material</a><a href="#">Jobs</a>
    <a href="#">Launch</a><a href="#">Results</a><a href="#">Elements</a><a href="#">Library</a><a href="#">Reports</a>
  </nav>
  <header class="top">
    <input class="cmd" type="text" aria-label="Command bar" placeholder="Go to, find a run, or ask in plain words   Ctrl+K">
    <span class="live" id="live" role="status"><i></i><span>connecting</span></span>
    <button class="plain" id="theme" type="button"></button>
  </header>
  <main>
    <section class="panel mimic" aria-label="Pipeline">
      <div class="head"><h2>Pipeline</h2><p class="status" id="status">Reading the board</p><div class="key" id="key"></div></div>
      <div class="wallbox"><div class="wallwrap"><svg id="tracks" aria-hidden="true"></svg><div class="wall" id="wall"></div></div></div>
      <p class="notice" id="notice" role="status"></p>
      <details class="edit"><summary>Edit the pipeline</summary><div class="forms">
        <form id="addStage"><label>New process<input name="label" required maxlength="24" placeholder="Relaxation"></label>
          <label>Place it<select name="after"></select></label><button class="solid">Add process</button></form>
        <form id="addLane"><label>New material or variant<input name="name" required maxlength="24" placeholder="GaN"></label>
          <label>Variant of<select name="parent"></select></label><button class="solid">Add row</button></form>
      </div><p class="fine">In the diagram: hover a process or a row to move or remove it, and use the + in an empty place to add a step.</p></details>
    </section>
    <div class="src" id="src"></div>
  </main>
  <aside class="dock" aria-label="Details"><section id="selected"></section><section><h2>What to launch now</h2><ul class="next" id="next"></ul></section></aside>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const BOARD_STATE = { faltan: "todo", enviado: "sent", terminado: "done" };
  const WORD = { todo: "ready to launch", sent: "sent", done: "done", failed: "failed", attention: "check first", waiting: "waiting" };
  const PLAIN = { todo: "to do", sent: "sent", done: "done", failed: "failed" };
  const COMMAND = { vasp: "python <tools>/hipipe.py pre --n N --dry-run", training: "python <tools>/hipipe.py fit --dry-run", shengbte: "python <tools>/hipipe.py bte --dry-run" };
  const GLYPH = {
    done: '<svg viewBox="0 0 16 16"><path d="M3.6 8.4l2.9 2.9 5.9-6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    failed: '<svg viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    sent: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="currentColor"/></svg>',
    attention: '<svg viewBox="0 0 30 30"><path d="M15 3.5l12.5 22h-25z" fill="currentColor"/><path d="M15 12v7M15 22v.6" stroke="var(--on)" stroke-width="2.6" stroke-linecap="round"/></svg>',
    todo: "", waiting: "",
  };
  const ICON = {
    x: '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    left: '<svg viewBox="0 0 12 12"><path d="M7.5 2L3.5 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    right: '<svg viewBox="0 0 12 12"><path d="M4.5 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  let ST = null, store = null, lastKey = "", selected = null, undo = null, note = "", seen = {}, M = null;

  const root = document.documentElement, themeBtn = $("theme");
  const setTheme = (t) => { root.dataset.theme = t; themeBtn.textContent = t === "dark" ? "Light theme" : "Dark theme"; };
  setTheme("dark"); themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));
  $("key").innerHTML = ["done", "sent", "todo", "attention", "waiting", "failed"].map((k) => `<span><i class="lamp ${k}">${GLYPH[k]}</i>${WORD[k]}</span>`).join("");
  const clock = (t) => new Date(t * 1000).toLocaleTimeString("en-GB");
  const when = (t) => { if (!t) return "unknown"; const d = typeof t === "number" ? new Date(t * 1000) : new Date(t);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); };

  function steps() {
    const hs = new Set(store.hidden.steps), hl = new Set(store.hidden.lanes), ok = new Set(store.stages.map((s) => s.id)), out = [];
    if (ST.board) for (const it of ST.board.items) out.push({ id: it.id, stage: it.stage, name: it.name, state: BOARD_STATE[it.status] || "todo", updated: it.updated, note: it.note, source: "board" });
    for (const it of store.steps) out.push(Object.assign({ source: "room" }, it));
    return out.filter((it) => !hs.has(it.id) && !hl.has(it.name) && ok.has(it.stage));
  }
  function parentOf(name, names) {
    if (name in store.parents) return names.includes(store.parents[name]) ? store.parents[name] : null;
    let best = null;
    for (const m of names) if (m !== name && name.startsWith(m) && /[\sA-Z]/.test(name[m.length] || "") && (!best || m.length > best.length)) best = m;
    return best;
  }
  function model() {
    const all = steps(), hl = new Set(store.hidden.lanes), names = [], lanes = [];
    for (const n of all.map((s) => s.name).concat(store.lanes)) if (!names.includes(n) && !hl.has(n)) names.push(n);
    const par = {}; names.forEach((n) => { par[n] = parentOf(n, names); });
    names.filter((n) => !par[n]).forEach((n) => { lanes.push({ name: n, parent: null }); names.filter((v) => par[v] === n).forEach((v) => lanes.push({ name: v, parent: n })); });
    const at = (lane, stage) => all.find((s) => s.name === lane && s.stage === stage);
    const order = store.stages.map((s) => s.id), label = Object.fromEntries(store.stages.map((s) => [s.id, s.label]));
    const polar = (n) => (store.polar || []).includes(par[n] || n), potential = (n) => (store.potential || []).includes(n);
    for (const s of all) {
      s.view = s.state; s.rule = ""; s.kind = null; s.prev = null;
      const i = order.indexOf(s.stage); let prev = null, viaParent = false;
      for (let j = i - 1; j >= 0 && !prev; j--) { prev = at(s.name, order[j]); if (!prev && par[s.name] && !potential(s.name)) { prev = at(par[s.name], order[j]); viaParent = !!prev; } }
      s.prev = prev; s.viaParent = viaParent;
      if (s.state !== "todo") continue;
      if (!prev) { s.kind = "ready"; s.rule = "First step of this row: nothing has to finish before it."; }
      else if (prev.state !== "done") { s.kind = "waiting"; s.view = "waiting"; s.rule = `Waits for ${label[prev.stage]} of ${prev.name} (${PLAIN[prev.state]}).`; }
      else if (viaParent) { s.kind = "attention"; s.view = "attention"; s.rule = `${label[prev.stage]} of ${prev.name} is done, but this row has no ${label[prev.stage]} step of its own. Check that this variant's ${label[prev.stage]} exists before launching.`; }
      else { s.kind = "ready"; s.rule = `${label[prev.stage]} of ${prev.name} is done.`; }
      if (polar(s.name) && s.stage === "training") s.rule += " Polar: needs the Born-charge run and --lr in the fit.";
      if (polar(s.name) && s.stage === "shengbte") s.rule += " Polar: needs polar = yes and Born charges in CONTROL.";
    }
    return { all, lanes, at, label, polar, potential };
  }

  function draw() {
    if (!M) return;
    const svg = $("tracks"), pos = {};
    $("wall").querySelectorAll(".lamp").forEach((b) => { pos[b.dataset.id] = { x: b.offsetLeft + b.offsetWidth / 2, y: b.offsetTop + b.offsetHeight / 2 }; });
    const R = 19; let h = "";
    for (const s of M.all) {
      const b = pos[s.id]; if (!b) continue;
      if (!s.prev) { if (M.potential(s.name)) { const ox = b.x - 74; h += `<path class="seg lit" d="M${ox + 9} ${b.y}H${b.x - R}"/><path class="origin" d="M${ox} ${b.y - 7}l7 7-7 7-7-7z"/><text class="otext" x="${ox - 12}" y="${b.y + 4}" text-anchor="end">from a potential</text>`; } continue; }
      const a = pos[s.prev.id]; if (!a) continue;
      const cls = s.prev.state === "done" && s.state === "done" ? "lit" : s.prev.state === "done" && (s.kind === "ready" || s.kind === "attention") ? "next" : "dim";
      if (Math.abs(a.y - b.y) < 1) h += `<path class="seg ${cls}" d="M${a.x + R} ${a.y}H${b.x - R}"/>`;
      else { const x1 = a.x + R, x2 = b.x - R, mx = (x1 + x2) / 2; h += `<path class="seg ${cls}" d="M${x1} ${a.y}C${mx} ${a.y} ${mx} ${b.y} ${x2} ${b.y}"/>`; }
    }
    svg.innerHTML = h;
  }

  function render() {
    M = model(); const n = store.stages.length, wall = $("wall");
    wall.style.gridTemplateColumns = `minmax(170px, 210px) repeat(${n}, minmax(128px, 1fr))`;
    let h = '<div class="corner">Material</div>';
    store.stages.forEach((s, i) => { h += `<div class="stagehead"><b>${esc(s.label)}</b><span class="tools">
      <button class="icon" data-act="left" data-id="${s.id}" aria-label="Move ${esc(s.label)} left" ${i ? "" : "disabled hidden"}>${ICON.left}</button>
      <button class="icon" data-act="right" data-id="${s.id}" aria-label="Move ${esc(s.label)} right" ${i < n - 1 ? "" : "disabled hidden"}>${ICON.right}</button>
      <button class="icon" data-act="dropstage" data-id="${s.id}" aria-label="Remove the process ${esc(s.label)}">${ICON.x}</button></span></div>`; });
    for (const l of M.lanes) {
      h += `<div class="lanehead ${l.parent ? "variant" : ""}"><span>${esc(l.name)}</span>${!l.parent && M.polar(l.name) ? "<small>polar</small>" : ""}<span class="tools"><button class="icon" data-act="droplane" data-id="${esc(l.name)}" aria-label="Remove the row ${esc(l.name)}">${ICON.x}</button></span></div>`;
      for (const s of store.stages) {
        const it = M.at(l.name, s.id);
        if (!it) { h += `<div class="cell"><button class="add" data-act="addstep" data-lane="${esc(l.name)}" data-stage="${s.id}" aria-label="Add ${esc(s.label)} to ${esc(l.name)}">+</button></div>`; continue; }
        const changed = seen[it.id] && seen[it.id] !== it.view ? " changed" : "";
        h += `<div class="cell"><button class="lamp ${it.view}${changed}" data-act="select" data-id="${esc(it.id)}" aria-pressed="${selected === it.id}" title="${esc(s.label)} of ${esc(l.name)}: ${WORD[it.view]}" aria-label="${esc(s.label)} of ${esc(l.name)}: ${WORD[it.view]}">${GLYPH[it.view]}</button></div>`;
      }
    }
    wall.innerHTML = h;
    seen = Object.fromEntries(M.all.map((s) => [s.id, s.view]));

    const todo = M.all.filter((s) => s.kind), c = (k) => todo.filter((s) => s.kind === k).length;
    const jobs = ST.localJobs, running = jobs ? jobs.filter((j) => j.state === "running") : [];
    const parts = [c("ready") ? `${c("ready")} ready to launch` : "", c("attention") ? `${c("attention")} to check first` : "", c("waiting") ? `${c("waiting")} waiting` : ""].filter(Boolean);
    $("status").textContent = parts.length ? parts.join(", ") : "Nothing is waiting for you";

    const rank = { ready: 0, attention: 1, waiting: 2 };
    $("next").innerHTML = todo.slice().sort((a, b) => rank[a.kind] - rank[b.kind]).map((s) =>
      `<li><button data-act="select" data-id="${esc(s.id)}"><b>${esc(M.label[s.stage])} of ${esc(s.name)}<span>${WORD[s.view]}</span></b><p>${esc(s.rule)}</p></button></li>`).join("") || "<li>Nothing is waiting for you.</li>";

    const sel = M.all.find((s) => s.id === selected) || todo.sort((a, b) => rank[a.kind] - rank[b.kind])[0] || M.all[0];
    selected = sel ? sel.id : null;
    wall.querySelectorAll(".lamp").forEach((t) => t.setAttribute("aria-pressed", t.dataset.id === selected));
    $("selected").innerHTML = !sel ? "<h2>Nothing selected</h2><p class='fine'>The pipeline is empty. Add a row and a step.</p>" : `<h2>${esc(M.label[sel.stage])} of ${esc(sel.name)}</h2>
      <dl><dt>State</dt><dd>${WORD[sel.view]}</dd><dt>Comes from</dt><dd>${sel.source === "board" ? "the work board" : "added in Command Room"}</dd>
      <dt>Last change</dt><dd>${when(sel.updated)}</dd>${sel.note ? `<dt>Note</dt><dd>${esc(sel.note)}</dd>` : ""}<dt>Rule</dt><dd>${esc(sel.rule || "Nothing to do here.")}</dd></dl>
      ${sel.kind && sel.kind !== "waiting" && COMMAND[sel.stage] ? `<pre>${esc(COMMAND[sel.stage])}</pre><p class="fine">Runs as a dry run first. Nothing is sent without your click.</p>` : ""}
      ${sel.source === "room" ? `<div class="acts">${["todo", "sent", "done", "failed"].map((k) => `<button class="plain" data-act="state" data-id="${esc(sel.id)}" data-state="${k}" aria-pressed="${sel.state === k}">${PLAIN[k]}</button>`).join("")}</div>
        <div class="acts"><button class="plain" data-act="dropstep" data-id="${esc(sel.id)}">Remove this step</button></div>`
        : `<div class="acts"><button class="plain" data-act="dropstep" data-id="${esc(sel.id)}">Hide this step here</button></div><p class="fine">Its state is read from the work board and changes there. Hiding it here leaves the board as it is.</p>`}`;

    $("src").innerHTML = ST.clusters.map((cl) => `<div class="panel"><h3><i></i>${esc(cl.label)}</h3><p>Not connected. Command Room has not been allowed to read this queue yet.</p></div>`).join("") +
      `<div class="panel"><h3><i class="${running.length ? "on" : ""}"></i>This computer</h3>${jobs === null ? "<p>The jobs folder was not given to the server.</p>" : running.length ? running.map((j) => `<p class="mono">${esc(j.name)}  ${j.step}/${j.total}  ${esc(j.phase || "")}  ${esc(j.metric || "")}</p><div class="prog"><i style="width:${Math.round(100 * j.step / (j.total || 1))}%"></i></div>`).join("") : "<p>Nothing is running.</p>"}
      ${jobs && jobs.length && !running.length ? `<p>Last to finish: <span class="mono">${esc(jobs[jobs.length - 1].name)}</span>, ${when(jobs[jobs.length - 1].updated)}.</p>` : ""}</div>`;

    const fill = (el, html) => { if (document.activeElement !== el) { const v = el.value; el.innerHTML = html; if ([...el.options].some((o) => o.value === v)) el.value = v; } };
    fill($("addStage").after, `<option value="__end">at the end</option><option value="__start">at the start</option>` + store.stages.map((s) => `<option value="${s.id}">after ${esc(s.label)}</option>`).join(""));
    fill($("addLane").parent, `<option value="">nothing, it is a material</option>` + M.lanes.filter((l) => !l.parent).map((l) => `<option>${esc(l.name)}</option>`).join(""));
    const hidden = store.hidden.lanes.map((l) => `<button class="link" data-act="showlane" data-id="${esc(l)}">bring back ${esc(l)}</button>`)
      .concat(store.hidden.steps.length ? [`<button class="link" data-act="showsteps">bring back ${store.hidden.steps.length} hidden step${store.hidden.steps.length === 1 ? "" : "s"}</button>`] : []);
    $("notice").innerHTML = (note ? `<span>${esc(note)}</span>${undo ? '<button class="link" data-act="undo">Undo</button>' : ""}` : "") +
      (ST.board ? "" : "<span>The work board file was not given to the server, so its steps are missing.</span>") + hidden.join("");
    requestAnimationFrame(draw);
  }

  async function load() {
    try {
      const s = await (await fetch("/api/state", { cache: "no-store" })).json();
      const key = JSON.stringify([s.board, s.localJobs, s.pipeline]), live = $("live");
      live.className = "live"; void live.offsetWidth; live.className = "live beat"; live.lastElementChild.textContent = "live " + clock(s.generated);
      if (key !== lastKey) { lastKey = key; ST = s; store = s.pipeline; render(); }
    } catch (e) { $("live").className = "live lost"; $("live").lastElementChild.textContent = "no contact with the local server"; }
  }
  async function change(text, fn) {
    undo = JSON.stringify(store); fn(); note = text; render();
    await fetch("/api/pipeline", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(store) });
    lastKey = ""; load();
  }
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b || !store) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "select") { selected = id; render(); }
    else if (act === "undo" && undo) { const back = JSON.parse(undo); change("Undone.", () => { store = back; }).then(() => { undo = null; }); }
    else if (act === "dropstage") { const s = store.stages.find((x) => x.id === id); change(`Removed the process ${s.label}. Its steps are kept and return if you add it again.`, () => { store.removed = (store.removed || []).filter((x) => x.id !== id).concat([s]); store.stages = store.stages.filter((x) => x.id !== id); }); }
    else if (act === "left" || act === "right") change("Moved the process.", () => { const i = store.stages.findIndex((x) => x.id === id), j = i + (act === "left" ? -1 : 1), t = store.stages[i]; store.stages[i] = store.stages[j]; store.stages[j] = t; });
    else if (act === "droplane") change(`Removed the row ${id}. The work board is not changed.`, () => { store.hidden.lanes.push(id); store.lanes = store.lanes.filter((x) => x !== id); });
    else if (act === "showlane") change(`Brought back ${id}.`, () => { store.hidden.lanes = store.hidden.lanes.filter((x) => x !== id); });
    else if (act === "showsteps") change("Brought back the hidden steps.", () => { store.hidden.steps = []; });
    else if (act === "addstep") { const sid = "room__" + slug(b.dataset.stage) + "__" + slug(b.dataset.lane) + "__" + Date.now().toString(36); selected = sid;
      change("Added a step.", () => { store.steps.push({ id: sid, stage: b.dataset.stage, name: b.dataset.lane, state: "todo", updated: new Date().toISOString() }); }); }
    else if (act === "state") change("State changed.", () => { const s = store.steps.find((x) => x.id === id); s.state = b.dataset.state; s.updated = new Date().toISOString(); });
    else if (act === "dropstep") change("Removed the step.", () => { if (store.steps.some((x) => x.id === id)) store.steps = store.steps.filter((x) => x.id !== id); else store.hidden.steps.push(id); selected = null; });
  });
  $("addStage").addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, label = f.label.value.trim(), after = f.after.value; if (!label || !store) return;
    if (store.stages.some((x) => x.label.toLowerCase() === label.toLowerCase())) { note = `There is already a process called ${label}.`; undo = null; return render(); }
    const old = (store.removed || []).find((x) => x.label.toLowerCase() === label.toLowerCase());
    change(`Added the process ${label}.`, () => { const s = old || { id: "x-" + slug(label) + "-" + Date.now().toString(36), label };
      store.removed = (store.removed || []).filter((x) => x !== old);
      const i = after === "__end" ? store.stages.length : after === "__start" ? 0 : store.stages.findIndex((x) => x.id === after) + 1; store.stages.splice(i, 0, s); });
    f.label.value = "";
  });
  $("addLane").addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, name = f.name.value.trim(), parent = f.parent.value; if (!name || !store) return;
    change(`Added the row ${name}. Use the + in its row to add steps.`, () => { store.hidden.lanes = store.hidden.lanes.filter((x) => x !== name);
      if (!store.lanes.includes(name)) store.lanes.push(name); store.parents[name] = parent; });
    f.name.value = "";
  });
  new ResizeObserver(draw).observe($("wall"));
  load(); setInterval(load, 3000);
})();
</script>
</body>
</html>
