<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Room, direction C: status wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1e1f23; --panel: #26272c; --raise: #303238; --line: #3d3f47; --ink: #f4f4f1; --ink-2: #c6c7cc; --muted: #9496a0;
  --done: #3ecf8e; --sent: #6ea8ff; --attention: #ffc233; --failed: #ff6b6b; --on-tile: #101114;
  --sans: "Archivo", "Segoe UI", sans-serif; --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}
[data-theme="light"] {
  --bg: #f1f1ee; --panel: #ffffff; --raise: #e9e9e4; --line: #cfcfc8; --ink: #17181b; --ink-2: #40424a; --muted: #6a6c75;
  --done: #2fbf7f; --sent: #5b9bff; --attention: #f5b716; --failed: #f25f5f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14.5px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.app { display: grid; grid-template-columns: 150px minmax(0, 1fr); min-height: 100vh; }
.rail { padding: 20px 10px; border-right: 1px solid var(--line); }
.rail .name { font: 800 17px/1.05 var(--sans); font-stretch: 112%; padding: 0 8px 18px; }
.rail a { display: block; padding: 7px 8px; color: var(--ink-2); text-decoration: none; border-radius: 6px; font-weight: 500; }
.rail a[aria-current] { background: var(--ink); color: var(--bg); }
.rail a:hover:not([aria-current]) { background: var(--raise); color: var(--ink); }
.page { padding: 18px 26px 40px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.cmd { flex: 1; min-width: 220px; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 13px; }
.cmd::placeholder { color: var(--muted); }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.live i { width: 9px; height: 9px; border-radius: 50%; background: var(--done); }
.live.lost i { background: var(--attention); border-radius: 2px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-size: 13px; }
.ghost:hover { border-color: var(--ink-2); }
h1 { margin: 26px 0 20px; font: 700 clamp(22px, 2.6vw, 34px)/1.15 var(--sans); font-stretch: 108%; max-width: 30em; letter-spacing: -.01em; }
h2 { margin: 0 0 10px; font: 700 17px/1.2 var(--sans); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 26px; align-items: start; }
.wallbox { overflow-x: auto; padding-bottom: 4px; }
.wall { display: grid; gap: 6px; min-width: min-content; }
.corner { align-self: end; color: var(--muted); font-size: 13px; padding: 0 0 4px 2px; }
.stagehead { display: flex; align-items: end; justify-content: space-between; gap: 4px; padding: 0 0 4px 2px; min-width: 116px; }
.stagehead b { font-weight: 650; font-stretch: 84%; font-size: 15px; overflow-wrap: anywhere; }
.tools { display: inline-flex; gap: 1px; opacity: .55; }
.stagehead:hover .tools, .lanehead:hover .tools, .tools:focus-within { opacity: 1; }
.icon { background: none; border: 0; border-radius: 5px; width: 22px; height: 22px; padding: 0; color: var(--ink-2); display: inline-grid; place-items: center; }
.icon:hover { background: var(--raise); color: var(--ink); }
.icon svg { width: 12px; height: 12px; }
.lanehead { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 42px; padding-right: 4px; font-weight: 650; font-size: 15.5px; }
.lanehead.variant { font-weight: 450; color: var(--ink-2); padding-left: 16px; font-size: 14.5px; }
.lanehead small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.tile, .add { min-height: 42px; border-radius: 7px; width: 100%; text-align: left; padding: 0 11px; font-weight: 650; font-stretch: 92%; font-size: 14px; border: 2px solid transparent; }
.tile { color: var(--on-tile); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile.done { background: var(--done); } .tile.attention { background: var(--attention); } .tile.failed { background: var(--failed); }
.tile.sent { background: var(--sent) repeating-linear-gradient(-45deg, transparent 0 9px, rgba(16,17,20,.13) 9px 18px); background-size: 200% 100%; animation: move 2.4s linear infinite; }
.tile.todo, .tile.waiting { background: none; color: var(--ink); border: 2px dashed var(--line); font-weight: 500; }
.tile.waiting { color: var(--muted); }
.tile small { font-weight: 500; font-size: 11.5px; opacity: .75; }
.tile[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.tile.changed { animation: flash 1.4s ease-out 1; }
.tile.sent.changed { animation: flash 1.4s ease-out 1, move 2.4s linear infinite; }
.add { background: none; border: 0; color: transparent; text-align: center; font-size: 18px; font-weight: 400; }
.add:hover, .add:focus-visible { background: var(--raise); color: var(--ink-2); }
@keyframes move { to { background-position: -25.46px 0; } }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--ink); } 100% { box-shadow: 0 0 0 12px transparent; } }
@media (prefers-reduced-motion: reduce) { .tile.sent, .tile.changed { animation: none; } }
.edit { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.edit form { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
.edit label { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.edit input, .edit select { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 130px; }
.solid { background: var(--ink); color: var(--bg); border: 0; border-radius: 7px; padding: 7px 13px; font-weight: 650; }
.notice { margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-height: 22px; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--ink); font-size: 13.5px; }
.side { display: grid; gap: 22px; }
.card { background: var(--panel); border-radius: 10px; padding: 16px; }
dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 13.5px; }
dt { color: var(--muted); } dd { margin: 0; }
pre { margin: 12px 0 0; padding: 9px 10px; background: var(--bg); border-radius: 7px; font: 400 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.acts .ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fine { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.next { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.next button { width: 100%; text-align: left; background: var(--raise); border: 0; border-radius: 8px; padding: 9px 11px; }
.next b { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
.next b span { font-weight: 450; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.next p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.src { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.src h3 { margin: 0 0 3px; font: 650 15px var(--sans); }
.src p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.prog { height: 8px; border-radius: 4px; background: var(--raise); margin: 6px 0 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--sent); }
@media (max-width: 1180px) { .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .name { padding: 7px 8px; white-space: nowrap; } .rail a { white-space: nowrap; }
  .page { padding: 14px 14px 32px; } .src { grid-template-columns: minmax(0, 1fr); } .live { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Areas">
    <div class="name">Command Room</div>
    <a href="#" aria-current="page">Mission control</a><a href="#">Board</a><a href="#">Material</a><a href="#">Jobs</a>
    <a href="#">Launch</a><a href="#">Results</a><a href="#">Elements</a><a href="#">Library</a><a href="#">Reports</a>
  </nav>
  <div class="page">
    <div class="bar">
      <input class="cmd" type="text" aria-label="Command bar" placeholder="Go to, find a run, or ask in plain words   Ctrl+K">
      <span class="live" id="live" role="status"><i></i><span>Connecting</span></span>
      <button class="ghost" id="theme" type="button"></button>
    </div>
    <h1 id="headline">Reading the board</h1>
    <div class="cols">
      <section aria-label="Pipeline">
        <div class="wallbox"><div class="wall" id="wall"></div></div>
        <p class="notice" id="notice" role="status"></p>
        <div class="edit">
          <form id="addStage"><label>New process<input name="label" required maxlength="24" placeholder="Relaxation"></label>
            <label>Place it<select name="after"></select></label><button class="solid">Add process</button></form>
          <form id="addLane"><label>New material or variant<input name="name" required maxlength="24" placeholder="GaN"></label>
            <label>Variant of<select name="parent"></select></label><button class="solid">Add row</button></form>
        </div>
        <div class="src" id="src"></div>
      </section>
      <aside class="side" aria-label="Details"><div class="card" id="selected"></div><div class="card"><h2>What to launch now</h2><ul class="next" id="next"></ul></div></aside>
    </div>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const BOARD_STATE = { faltan: "todo", enviado: "sent", terminado: "done" };
  const WORD = { todo: "to do", sent: "sent", done: "done", failed: "failed", attention: "check first", waiting: "waiting" };
  const COMMAND = { vasp: "python <tools>/hipipe.py pre --n N --dry-run", training: "python <tools>/hipipe.py fit --dry-run", shengbte: "python <tools>/hipipe.py bte --dry-run" };
  const ICON = {
    x: '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    left: '<svg viewBox="0 0 12 12"><path d="M7.5 2L3.5 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    right: '<svg viewBox="0 0 12 12"><path d="M4.5 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  let ST = null, store = null, lastKey = "", selected = null, undo = null, note = "", seen = {};

  const root = document.documentElement, themeBtn = $("theme");
  const setTheme = (t) => { root.dataset.theme = t; themeBtn.textContent = t === "dark" ? "Light theme" : "Dark theme"; };
  setTheme("dark"); themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));
  const clock = (t) => new Date(t * 1000).toLocaleTimeString("en-GB");
  const when = (t) => { if (!t) return "unknown"; const d = typeof t === "number" ? new Date(t * 1000) : new Date(t);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); };

  function steps() {
    const hs = new Set(store.hidden.steps), hl = new Set(store.hidden.lanes), ok = new Set(store.stages.map((s) => s.id)), out = [];
    if (ST.board) for (const it of ST.board.items) out.push({ id: it.id, stage: it.stage, name: it.name, state: BOARD_STATE[it.status] || "todo", updated: it.updated, note: it.note, source: "board" });
    for (const it of store.steps) out.push(Object.assign({ source: "room" }, it));
    return out.filter((it) => !hs.has(it.id) && !hl.has(it.name) && ok.has(it.stage));
  }
  function laneNames(all) {
    const hl = new Set(store.hidden.lanes), names = [];
    for (const n of all.map((s) => s.name).concat(store.lanes)) if (!names.includes(n) && !hl.has(n)) names.push(n);
    return names;
  }
  function parentOf(name, names) {
    if (name in store.parents) return names.includes(store.parents[name]) ? store.parents[name] : null;
    let best = null;
    for (const m of names) if (m !== name && name.startsWith(m) && /[\sA-Z]/.test(name[m.length] || "") && (!best || m.length > best.length)) best = m;
    return best;
  }
  function model() {
    const all = steps(), names = laneNames(all), lanes = [];
    const par = {}; names.forEach((n) => { par[n] = parentOf(n, names); });
    names.filter((n) => !par[n]).forEach((n) => { lanes.push({ name: n, parent: null }); names.filter((v) => par[v] === n).forEach((v) => lanes.push({ name: v, parent: n })); });
    const at = (lane, stage) => all.find((s) => s.name === lane && s.stage === stage);
    const order = store.stages.map((s) => s.id), label = Object.fromEntries(store.stages.map((s) => [s.id, s.label]));
    for (const s of all) {
      s.view = s.state; s.rule = ""; s.kind = null;
      if (s.state !== "todo") continue;
      const i = order.indexOf(s.stage); let prev = null, viaParent = false;
      for (let j = i - 1; j >= 0 && !prev; j--) { prev = at(s.name, order[j]); if (!prev && par[s.name]) { prev = at(par[s.name], order[j]); viaParent = !!prev; } }
      if (!prev) { s.kind = "ready"; s.rule = "First step of this row: nothing has to finish before it."; }
      else if (prev.state !== "done") { s.kind = "waiting"; s.view = "waiting"; s.rule = `Waits for ${label[prev.stage]} of ${prev.name} (${WORD[prev.state]}).`; }
      else if (viaParent) { s.kind = "attention"; s.view = "attention"; s.rule = `${label[prev.stage]} of ${prev.name} is done, but this row has no ${label[prev.stage]} step of its own. Check that this variant's ${label[prev.stage]} exists before launching.`; }
      else { s.kind = "ready"; s.rule = `${label[prev.stage]} of ${prev.name} is done.`; }
    }
    return { all, lanes, at, label, names };
  }

  function render() {
    const M = model(), n = store.stages.length, wall = $("wall");
    wall.style.gridTemplateColumns = `minmax(150px, 190px) repeat(${n}, minmax(116px, 1fr))`;
    let h = '<div class="corner">Material</div>';
    store.stages.forEach((s, i) => { h += `<div class="stagehead"><b>${esc(s.label)}</b><span class="tools">
      <button class="icon" data-act="left" data-id="${s.id}" aria-label="Move ${esc(s.label)} left" ${i ? "" : "disabled hidden"}>${ICON.left}</button>
      <button class="icon" data-act="right" data-id="${s.id}" aria-label="Move ${esc(s.label)} right" ${i < n - 1 ? "" : "disabled hidden"}>${ICON.right}</button>
      <button class="icon" data-act="dropstage" data-id="${s.id}" aria-label="Remove the process ${esc(s.label)}">${ICON.x}</button></span></div>`; });
    for (const l of M.lanes) {
      h += `<div class="lanehead ${l.parent ? "variant" : ""}"><span>${esc(l.name)}</span><span class="tools"><button class="icon" data-act="droplane" data-id="${esc(l.name)}" aria-label="Remove the row ${esc(l.name)}">${ICON.x}</button></span></div>`;
      for (const s of store.stages) {
        const it = M.at(l.name, s.id);
        if (!it) { h += `<button class="add" data-act="addstep" data-lane="${esc(l.name)}" data-stage="${s.id}" aria-label="Add ${esc(s.label)} to ${esc(l.name)}">+</button>`; continue; }
        const changed = seen[it.id] && seen[it.id] !== it.view ? " changed" : "";
        h += `<button class="tile ${it.view}${changed}" data-act="select" data-id="${esc(it.id)}" aria-pressed="${selected === it.id}" aria-label="${esc(s.label)} of ${esc(l.name)}: ${WORD[it.view]}">${WORD[it.view]}${it.source === "room" ? "<small>added here</small>" : ""}</button>`;
      }
    }
    wall.innerHTML = h;
    seen = Object.fromEntries(M.all.map((s) => [s.id, s.view]));

    const todo = M.all.filter((s) => s.kind), c = (k) => todo.filter((s) => s.kind === k).length;
    const jobs = ST.localJobs, running = jobs ? jobs.filter((j) => j.state === "running") : [];
    const part = (k, one, many) => c(k) ? `${c(k)} ${c(k) === 1 ? one : many}` : "";
    const parts = [part("ready", "step is ready to launch", "steps are ready to launch"), part("attention", "needs a check first", "need a check first"), part("waiting", "is waiting", "are waiting")].filter(Boolean);
    $("headline").textContent = (parts.length ? parts.join(", ") + ". " : "Nothing on the board is waiting for you. ") +
      (jobs === null ? "The jobs on this computer could not be read." : running.length ? `${running.length} job${running.length === 1 ? " is" : "s are"} running on this computer.` : "Nothing is running on this computer.");

    const rank = { ready: 0, attention: 1, waiting: 2 };
    $("next").innerHTML = todo.sort((a, b) => rank[a.kind] - rank[b.kind]).map((s) =>
      `<li><button data-act="select" data-id="${esc(s.id)}"><b>${esc(M.label[s.stage])} of ${esc(s.name)}<span>${s.kind === "ready" ? "ready" : WORD[s.view]}</span></b><p>${esc(s.rule)}</p></button></li>`).join("") || "<li>Nothing is waiting for you.</li>";

    const sel = M.all.find((s) => s.id === selected) || todo[0] || M.all[0];
    selected = sel ? sel.id : null;
    document.querySelectorAll('.tile').forEach((t) => t.setAttribute("aria-pressed", t.dataset.id === selected));
    $("selected").innerHTML = !sel ? "<h2>Nothing selected</h2><p class='fine'>The pipeline is empty. Add a row and a step.</p>" : `<h2>${esc(M.label[sel.stage])} of ${esc(sel.name)}</h2>
      <dl><dt>State</dt><dd>${WORD[sel.view]}</dd><dt>Comes from</dt><dd>${sel.source === "board" ? "the work board" : "added in Command Room"}</dd>
      <dt>Last change</dt><dd>${when(sel.updated)}</dd>${sel.note ? `<dt>Note</dt><dd>${esc(sel.note)}</dd>` : ""}<dt>Rule</dt><dd>${esc(sel.rule || "Nothing to do here.")}</dd></dl>
      ${sel.kind && sel.kind !== "waiting" && COMMAND[sel.stage] ? `<pre>${esc(COMMAND[sel.stage])}</pre><p class="fine">Runs as a dry run first. Nothing is sent without your click.</p>` : ""}
      ${sel.source === "room" ? `<div class="acts">${["todo", "sent", "done", "failed"].map((k) => `<button class="ghost" data-act="state" data-id="${esc(sel.id)}" data-state="${k}" aria-pressed="${sel.state === k}">${WORD[k]}</button>`).join("")}</div>
        <div class="acts"><button class="ghost" data-act="dropstep" data-id="${esc(sel.id)}">Remove this step</button></div>`
        : `<div class="acts"><button class="ghost" data-act="dropstep" data-id="${esc(sel.id)}">Hide this step here</button></div><p class="fine">Its state is read from the work board and changes there. Hiding it here leaves the board as it is.</p>`}`;

    $("src").innerHTML = ST.clusters.map((cl) => `<div><h3>${esc(cl.label)}</h3><p>Not connected. Command Room has not been allowed to read this queue yet.</p></div>`).join("") +
      `<div><h3>This computer</h3>${jobs === null ? "<p>The jobs folder was not given to the server.</p>" : running.length ? running.map((j) => `<p class="mono">${esc(j.name)}  ${j.step}/${j.total}  ${esc(j.phase || "")}  ${esc(j.metric || "")}</p><div class="prog"><i style="width:${Math.round(100 * j.step / (j.total || 1))}%"></i></div>`).join("") : "<p>Nothing is running.</p>"}
      ${jobs && jobs.length && !running.length ? `<p>Last to finish: <span class="mono">${esc(jobs[jobs.length - 1].name)}</span>, ${when(jobs[jobs.length - 1].updated)}.</p>` : ""}</div>`;

    const fill = (sel2, html) => { if (document.activeElement !== sel2) { const v = sel2.value; sel2.innerHTML = html; if ([...sel2.options].some((o) => o.value === v)) sel2.value = v; } };
    fill($("addStage").after, `<option value="__end">at the end</option><option value="__start">at the start</option>` + store.stages.map((s) => `<option value="${s.id}">after ${esc(s.label)}</option>`).join(""));
    fill($("addLane").parent, `<option value="">nothing, it is a material</option>` + M.lanes.filter((l) => !l.parent).map((l) => `<option>${esc(l.name)}</option>`).join(""));

    const hidden = store.hidden.lanes.map((l) => `<button class="link" data-act="showlane" data-id="${esc(l)}">bring back ${esc(l)}</button>`)
      .concat(store.hidden.steps.length ? [`<button class="link" data-act="showsteps">bring back ${store.hidden.steps.length} hidden step${store.hidden.steps.length === 1 ? "" : "s"}</button>`] : []);
    $("notice").innerHTML = (note ? `<span>${esc(note)}</span>${undo ? '<button class="link" data-act="undo">Undo</button>' : ""}` : "") +
      (ST.board ? "" : "<span>The work board file was not given to the server, so its steps are missing.</span>") + hidden.join("");
  }

  async function load() {
    try {
      const s = await (await fetch("/api/state", { cache: "no-store" })).json();
      const key = JSON.stringify([s.board, s.localJobs, s.pipeline]);
      $("live").className = "live"; $("live").lastElementChild.textContent = "Live, read " + clock(s.generated);
      if (key !== lastKey) { lastKey = key; ST = s; store = s.pipeline; render(); }
    } catch (e) { $("live").className = "live lost"; $("live").lastElementChild.textContent = "No contact with the local server"; }
  }
  async function change(text, fn) {
    undo = JSON.stringify(store); fn(); note = text; render();
    await fetch("/api/pipeline", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(store) });
    lastKey = ""; load();
  }
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b || !store) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "select") { selected = id; render(); }
    else if (act === "undo" && undo) { const back = JSON.parse(undo); change("Undone.", () => { store = back; }).then(() => { undo = null; }); }
    else if (act === "dropstage") { const s = store.stages.find((x) => x.id === id); change(`Removed the process ${s.label}. Its steps are kept and return if you add it again.`, () => { store.removed = (store.removed || []).filter((x) => x.id !== id).concat([s]); store.stages = store.stages.filter((x) => x.id !== id); }); }
    else if (act === "left" || act === "right") { change("Moved the process.", () => { const i = store.stages.findIndex((x) => x.id === id), j = i + (act === "left" ? -1 : 1); const t = store.stages[i]; store.stages[i] = store.stages[j]; store.stages[j] = t; }); }
    else if (act === "droplane") change(`Removed the row ${id}. The work board is not changed.`, () => { store.hidden.lanes.push(id); store.lanes = store.lanes.filter((x) => x !== id); });
    else if (act === "showlane") change(`Brought back ${id}.`, () => { store.hidden.lanes = store.hidden.lanes.filter((x) => x !== id); });
    else if (act === "showsteps") change("Brought back the hidden steps.", () => { store.hidden.steps = []; });
    else if (act === "addstep") { const sid = "room__" + slug(b.dataset.stage) + "__" + slug(b.dataset.lane) + "__" + Date.now().toString(36); selected = sid;
      change("Added a step.", () => { store.steps.push({ id: sid, stage: b.dataset.stage, name: b.dataset.lane, state: "todo", updated: new Date().toISOString() }); }); }
    else if (act === "state") change("State changed.", () => { const s = store.steps.find((x) => x.id === id); s.state = b.dataset.state; s.updated = new Date().toISOString(); });
    else if (act === "dropstep") change("Removed the step.", () => { if (store.steps.some((x) => x.id === id)) store.steps = store.steps.filter((x) => x.id !== id); else store.hidden.steps.push(id); selected = null; });
  });
  $("addStage").addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, label = f.label.value.trim(), after = f.after.value; if (!label || !store) return;
    const old = (store.removed || []).find((x) => x.label.toLowerCase() === label.toLowerCase());
    if (store.stages.some((x) => x.label.toLowerCase() === label.toLowerCase())) { note = `There is already a process called ${label}.`; undo = null; return render(); }
    change(`Added the process ${label}.`, () => { const s = old || { id: "x-" + slug(label) + "-" + Date.now().toString(36), label };
      store.removed = (store.removed || []).filter((x) => x !== old);
      const i = after === "__end" ? store.stages.length : after === "__start" ? 0 : store.stages.findIndex((x) => x.id === after) + 1; store.stages.splice(i, 0, s); });
    f.label.value = "";
  });
  $("addLane").addEventListener("submit", (e) => {
    e.preventDefault(); const f = e.target, name = f.name.value.trim(), parent = f.parent.value; if (!name || !store) return;
    change(`Added the row ${name}. Use the + in its row to add steps.`, () => { store.hidden.lanes = store.hidden.lanes.filter((x) => x !== name);
      if (!store.lanes.includes(name)) store.lanes.push(name); store.parents[name] = parent; });
    f.name.value = "";
  });
  load(); setInterval(load, 3000);
})();
</script>
</body>
</html>
